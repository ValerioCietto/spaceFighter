<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Pages</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #212b4a 0%, #0b1022 60%, #070a14 100%);
      color: #e6ecff;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    main {
      width: min(800px, 100%);
      background: rgb(12 18 34 / 88%);
      border: 1px solid rgb(114 141 255 / 32%);
      border-radius: 14px;
      box-shadow: 0 12px 50px rgb(0 0 0 / 45%);
      padding: 1.5rem;
    }

    h1 {
      margin-top: 0;
      letter-spacing: 0.02em;
      color: #f0f4ff;
    }

    #status {
      margin: 0.75rem 0 1.25rem;
      color: #a5b6ff;
      font-size: 0.95rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.5rem;
    }

    a {
      display: block;
      padding: 0.7rem 0.9rem;
      border: 1px solid rgb(119 144 255 / 36%);
      border-radius: 10px;
      color: #dbe5ff;
      text-decoration: none;
      background: rgb(27 37 70 / 55%);
      transition: transform 120ms ease, background 120ms ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-1px);
      background: rgb(54 70 128 / 70%);
    }
  </style>
</head>
<body>
  <main>
    <h1>Demo HTML Pages</h1>
    <p id="status">Loading demos...</p>
    <ul id="demo-links"></ul>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const demoLinksEl = document.getElementById('demo-links');

    const setStatus = (message) => {
      statusEl.textContent = message;
    };

    const getFileName = (href) => {
      const normalized = href.split('#')[0].split('?')[0];
      return normalized.substring(normalized.lastIndexOf('/') + 1);
    };

    const isHtmlFile = (href) => {
      const fileName = getFileName(href);
      return fileName.toLowerCase().endsWith('.html');
    };

    const renderLinks = (fileNames) => {
      demoLinksEl.innerHTML = '';

      fileNames.forEach((fileName) => {
        const listItem = document.createElement('li');
        const link = document.createElement('a');
        link.href = fileName;
        link.textContent = fileName;
        listItem.appendChild(link);
        demoLinksEl.appendChild(listItem);
      });
    };

    const loadHtmlFiles = async () => {
      try {
        const response = await fetch('./', { cache: 'no-store' });

        if (!response.ok) {
          throw new Error(`Directory request failed (${response.status})`);
        }

        const directoryMarkup = await response.text();
        const parsedDoc = new DOMParser().parseFromString(directoryMarkup, 'text/html');
        const fileNames = [...parsedDoc.querySelectorAll('a[href]')]
          .map((anchor) => anchor.getAttribute('href'))
          .filter(Boolean)
          .filter(isHtmlFile)
          .map((href) => getFileName(href))
          .filter((fileName) => fileName.toLowerCase() !== 'index.html')
          .filter((fileName, index, values) => values.indexOf(fileName) === index)
          .sort((left, right) => left.localeCompare(right));

        if (fileNames.length === 0) {
          setStatus('No HTML demo files found in this folder.');
          return;
        }

        renderLinks(fileNames);
        setStatus(`Found ${fileNames.length} HTML demo files.`);
      } catch (error) {
        setStatus('Unable to load directory listing dynamically. Make sure the web server allows directory indexes.');
      }
    };

    loadHtmlFiles();
  </script>
</body>
</html>
