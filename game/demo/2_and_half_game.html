<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2.5D Arena Fly Simulator</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #01020a;
      color: #f1f1f1;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.4;
      z-index: 2;
      max-width: 320px;
    }

    #hud kbd {
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-bottom-width: 2px;
      border-radius: 3px;
      display: inline-block;
      min-width: 18px;
      padding: 0 4px;
      text-align: center;
      font-size: 12px;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      pointer-events: none;
      z-index: 2;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.75);
    }

    #crosshair::before {
      left: 8px;
      top: 0;
      width: 2px;
      height: 18px;
    }

    #crosshair::after {
      left: 0;
      top: 8px;
      width: 18px;
      height: 2px;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 52px);
      gap: 8px;
      z-index: 3;
      user-select: none;
    }

    #fireButton {
      position: fixed;
      right: 20px;
      bottom: 28px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(140, 32, 32, 0.65);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.06em;
      z-index: 3;
      touch-action: none;
    }

    #fireButton:active,
    #fireButton.active {
      background: rgba(255, 96, 96, 0.9);
    }

    .ctrl-btn {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(15, 24, 46, 0.6);
      color: #fff;
      border-radius: 10px;
      font-size: 22px;
      font-weight: 700;
      touch-action: none;
    }

    .ctrl-btn:active,
    .ctrl-btn.active {
      background: rgba(100, 155, 255, 0.65);
    }

    #winMessage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(48px, 14vw, 140px);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff77f;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255, 247, 127, 0.9);
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    #winMessage.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>2.5D Fly Simulator</strong></div>
    <div><kbd>A</kbd> steer left • <kbd>D</kbd> steer right</div>
    <div><kbd>W</kbd> forward • <kbd>S</kbd> decelerate to stop</div>
    <div><kbd>Space</kbd> fire bullets</div>
    <div>Click/tap screen or FIRE button to shoot</div>
    <div id="stats">Speed: 0 | Plane Height: 250 | Score: 0 | Player HP: 100 | Enemy HP: 3 | Enemy Defeats: 0/9</div>
  </div>
  <div id="crosshair"></div>
  <div id="controls">
    <div></div>
    <button class="ctrl-btn" data-key="w" aria-label="Up">▲</button>
    <div></div>
    <button class="ctrl-btn" data-key="a" aria-label="Left">◀</button>
    <button class="ctrl-btn" data-key="s" aria-label="Down">▼</button>
    <button class="ctrl-btn" data-key="d" aria-label="Right">▶</button>
  </div>
  <button id="fireButton" aria-label="Fire">FIRE</button>
  <div id="winMessage">You Win</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

    const ARENA = {
      width: 6000,
      length: 6000,
      height: 500,
    };
    const FLIGHT_PLANE_HEIGHT = 250;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x01020a);
    scene.fog = new THREE.Fog(0x01020a, 1500, 7000);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 12000);

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);

    const directional = new THREE.DirectionalLight(0xbfd8ff, 0.85);
    directional.position.set(500, 600, -250);
    scene.add(directional);

    function makeStars(count = 2200) {
      const geometry = new THREE.BufferGeometry();
      const points = new Float32Array(count * 3);

      for (let i = 0; i < count; i += 1) {
        points[i * 3] = THREE.MathUtils.randFloatSpread(12000);
        points[i * 3 + 1] = THREE.MathUtils.randFloatSpread(4000);
        points[i * 3 + 2] = THREE.MathUtils.randFloatSpread(12000);
      }

      geometry.setAttribute("position", new THREE.BufferAttribute(points, 3));
      const material = new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: true });
      const stars = new THREE.Points(geometry, material);
      scene.add(stars);
    }

    makeStars();

    const arenaBox = new THREE.Box3(
      new THREE.Vector3(-ARENA.width / 2, 0, -ARENA.length / 2),
      new THREE.Vector3(ARENA.width / 2, ARENA.height, ARENA.length / 2)
    );

    const boundary = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(ARENA.width, ARENA.height, ARENA.length)),
      new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.35 })
    );
    boundary.position.set(0, ARENA.height / 2, 0);
    scene.add(boundary);

    const ship = new THREE.Group();

    const shipGeom = new THREE.ConeGeometry(20, 60, 3);
    shipGeom.rotateX(Math.PI / 2);
    const shipMat = new THREE.MeshStandardMaterial({ color: 0x67b7ff, flatShading: true, metalness: 0.2, roughness: 0.45 });
    const shipMesh = new THREE.Mesh(shipGeom, shipMat);
    ship.add(shipMesh);

    const wingGeom = new THREE.BoxGeometry(55, 4, 14);
    const wingMat = new THREE.MeshStandardMaterial({ color: 0x2e6ea8 });
    const wing = new THREE.Mesh(wingGeom, wingMat);
    wing.position.set(0, -8, -4);
    ship.add(wing);

    ship.position.set(0, FLIGHT_PLANE_HEIGHT, 0);
    scene.add(ship);

    const bulletGeometry = new THREE.SphereGeometry(5, 10, 10);
    const playerBulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const enemyBulletMaterial = new THREE.MeshBasicMaterial({ color: 0xc07bff });
    const playerBullets = [];
    const enemyBullets = [];

    const targetGeometry = new THREE.SphereGeometry(50, 24, 24);
    const targetMaterial = new THREE.MeshStandardMaterial({ color: 0xff5a5a, emissive: 0x240000, roughness: 0.45 });
    const targets = [];

    function createShipMesh(mainColor = 0x67b7ff, wingColor = 0x2e6ea8) {
      const model = new THREE.Group();
      const body = new THREE.Mesh(
        shipGeom,
        new THREE.MeshStandardMaterial({ color: mainColor, flatShading: true, metalness: 0.2, roughness: 0.45 })
      );
      const modelWing = new THREE.Mesh(wingGeom, new THREE.MeshStandardMaterial({ color: wingColor }));
      modelWing.position.set(0, -8, -4);
      model.add(body);
      model.add(modelWing);
      return model;
    }

    const enemy = createShipMesh(0xb048ff, 0x7e2bc2);
    enemy.position.set(0, FLIGHT_PLANE_HEIGHT, -1300);
    scene.add(enemy);

    function randomTargetPosition() {
      return new THREE.Vector3(
        THREE.MathUtils.randFloat(-ARENA.width / 2 + 80, ARENA.width / 2 - 80),
        FLIGHT_PLANE_HEIGHT,
        THREE.MathUtils.randFloat(-ARENA.length / 2 + 80, ARENA.length / 2 - 80)
      );
    }

    function spawnTarget(position = randomTargetPosition()) {
      const mesh = new THREE.Mesh(targetGeometry, targetMaterial.clone());
      mesh.position.copy(position);
      scene.add(mesh);
      targets.push(mesh);
    }

    for (let i = 0; i < 28; i += 1) {
      spawnTarget();
    }

    const keys = {
      a: false,
      d: false,
      w: false,
      s: false,
    };

    let speed = 0;
    const maxSpeed = 700;
    const acceleration = 360;
    const deceleration = 430;
    const yawSpeed = 1.55;
    let fireCooldown = 0;
    const fireInterval = 0.12;
    let score = 0;
    let playerHp = 100;
    const ENEMY_MAX_HP = 3;
    const MAX_ENEMY_DEFEATS = 9;
    let enemyHp = ENEMY_MAX_HP;
    let enemyDefeats = 0;
    let enemyFireCooldown = 1;
    const enemyChaseSpeed = 260;
    let isGameWon = false;

    const statsEl = document.getElementById("stats");
    const winMessageEl = document.getElementById("winMessage");

    const controlButtons = Array.from(document.querySelectorAll(".ctrl-btn"));
    const fireButton = document.getElementById("fireButton");

    function setButtonActive(key, state) {
      const btn = controlButtons.find((button) => button.dataset.key === key);
      if (btn) {
        btn.classList.toggle("active", state);
      }
    }

    function setDirectionalState(key, state) {
      if (!(key in keys)) {
        return;
      }
      keys[key] = state;
      setButtonActive(key, state);
    }

    for (const btn of controlButtons) {
      const key = btn.dataset.key;
      btn.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        btn.setPointerCapture(event.pointerId);
        setDirectionalState(key, true);
      });
      const clear = () => setDirectionalState(key, false);
      btn.addEventListener("pointerup", clear);
      btn.addEventListener("pointercancel", clear);
      btn.addEventListener("pointerleave", clear);
    }

    function clampShipToArena() {
      ship.position.x = THREE.MathUtils.clamp(ship.position.x, arenaBox.min.x, arenaBox.max.x);
      ship.position.y = FLIGHT_PLANE_HEIGHT;
      ship.position.z = THREE.MathUtils.clamp(ship.position.z, arenaBox.min.z, arenaBox.max.z);
    }

    function createBullet(source, direction, material, speedValue, lifeTime, list) {
      const bullet = new THREE.Mesh(bulletGeometry, material);
      const start = source.position.clone().add(direction.clone().multiplyScalar(40));

      bullet.position.copy(start);
      bullet.userData.velocity = direction.multiplyScalar(speedValue);
      bullet.userData.life = lifeTime;
      scene.add(bullet);
      list.push(bullet);
    }

    function firePlayerBullet() {
      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(ship.quaternion).normalize();
      createBullet(ship, direction, playerBulletMaterial, 1700, 2.7, playerBullets);
    }

    function tryFirePlayerBullet() {
      if (fireCooldown <= 0) {
        firePlayerBullet();
        fireCooldown = fireInterval;
      }
    }

    function fireEnemyBullet() {
      if (enemyHp <= 0) {
        return;
      }
      const direction = ship.position.clone().sub(enemy.position).setY(0).normalize();
      if (direction.lengthSq() === 0) {
        return;
      }
      createBullet(enemy, direction, enemyBulletMaterial, 900, 4, enemyBullets);
    }

    function setKeyState(event, state) {
      const key = event.key.toLowerCase();
      setDirectionalState(key, state);

      if (key === " " && state) {
        event.preventDefault();
      }
    }

    window.addEventListener("keydown", (event) => {
      setKeyState(event, true);
      if (event.key === " ") {
        tryFirePlayerBullet();
      }
    });

    window.addEventListener("keyup", (event) => setKeyState(event, false));

    renderer.domElement.addEventListener("pointerdown", () => {
      tryFirePlayerBullet();
    });

    fireButton.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      fireButton.classList.add("active");
      tryFirePlayerBullet();
    });
    fireButton.addEventListener("pointerup", () => fireButton.classList.remove("active"));
    fireButton.addEventListener("pointercancel", () => fireButton.classList.remove("active"));
    fireButton.addEventListener("pointerleave", () => fireButton.classList.remove("active"));

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function updateShip(delta) {
      if (keys.a) {
        ship.rotation.y += yawSpeed * delta;
      }
      if (keys.d) {
        ship.rotation.y -= yawSpeed * delta;
      }
      if (keys.w) {
        speed = Math.min(maxSpeed, speed + acceleration * delta);
      }
      if (keys.s) {
        speed = Math.max(0, speed - deceleration * delta);
      }

      const forward = new THREE.Vector3(0, 0, -1).applyEuler(ship.rotation).normalize();
      ship.position.addScaledVector(forward, speed * delta);

      clampShipToArena();
    }

    function updateCamera() {
      const chaseOffset = new THREE.Vector3(0, 80, 210).applyQuaternion(ship.quaternion);
      const desiredPos = ship.position.clone().add(chaseOffset);
      camera.position.lerp(desiredPos, 0.1);
      camera.lookAt(ship.position.clone().add(new THREE.Vector3(0, 18, 0)));
    }

    function updateBullets(delta, list) {
      for (let i = list.length - 1; i >= 0; i -= 1) {
        const bullet = list[i];
        bullet.position.addScaledVector(bullet.userData.velocity, delta);
        bullet.userData.life -= delta;

        const outOfBounds = !arenaBox.containsPoint(bullet.position);
        if (bullet.userData.life <= 0 || outOfBounds) {
          scene.remove(bullet);
          list.splice(i, 1);
        }
      }
    }

    function updateTargets(delta) {
      for (const target of targets) {
        target.rotation.y += delta * 0.5;
      }

      for (let b = playerBullets.length - 1; b >= 0; b -= 1) {
        const bullet = playerBullets[b];

        for (let t = targets.length - 1; t >= 0; t -= 1) {
          const target = targets[t];
          if (bullet.position.distanceTo(target.position) <= 55) {
            scene.remove(bullet);
            playerBullets.splice(b, 1);
            scene.remove(target);
            targets.splice(t, 1);

            score += 10;

            break;
          }
        }
      }

      if (enemyHp > 0) {
        for (let b = playerBullets.length - 1; b >= 0; b -= 1) {
          const bullet = playerBullets[b];
          if (bullet.position.distanceTo(enemy.position) <= 40) {
            scene.remove(bullet);
            playerBullets.splice(b, 1);
            enemyHp -= 1;

            if (enemyHp <= 0) {
              scene.remove(enemy);
              score += 100;
              enemyDefeats += 1;

              if (enemyDefeats < MAX_ENEMY_DEFEATS) {
                enemy.position.copy(randomTargetPosition());
                enemy.rotation.set(0, 0, 0);
                enemyHp = ENEMY_MAX_HP;
                enemyFireCooldown = 0.75;
                scene.add(enemy);
              }
            }
          }
        }
      }
    }

    function updateEnemy(delta) {
      if (enemyHp <= 0) {
        return;
      }
      const toPlayer = ship.position.clone().sub(enemy.position).setY(0);
      if (toPlayer.lengthSq() > 0.001) {
        const targetYaw = Math.atan2(toPlayer.x, toPlayer.z);
        enemy.rotation.y = -targetYaw;
        enemy.position.addScaledVector(toPlayer.normalize(), enemyChaseSpeed * delta);
        enemy.position.x = THREE.MathUtils.clamp(enemy.position.x, arenaBox.min.x, arenaBox.max.x);
        enemy.position.y = FLIGHT_PLANE_HEIGHT;
        enemy.position.z = THREE.MathUtils.clamp(enemy.position.z, arenaBox.min.z, arenaBox.max.z);
      }

      enemyFireCooldown -= delta;
      if (enemyFireCooldown <= 0) {
        fireEnemyBullet();
        enemyFireCooldown = 1;
      }
    }

    function updateDamage() {
      for (let i = enemyBullets.length - 1; i >= 0; i -= 1) {
        const bullet = enemyBullets[i];
        if (bullet.position.distanceTo(ship.position) <= 35) {
          scene.remove(bullet);
          enemyBullets.splice(i, 1);
          playerHp = Math.max(0, playerHp - 10);
        }
      }
    }

    function updateHud() {
      const enemyHpDisplay = enemyHp > 0 ? enemyHp : 0;
      statsEl.textContent = `Speed: ${speed.toFixed(0)} | Plane Height: ${FLIGHT_PLANE_HEIGHT} | Score: ${score} | Player HP: ${playerHp} | Enemy HP: ${enemyHpDisplay} | Enemy Defeats: ${enemyDefeats}/${MAX_ENEMY_DEFEATS}`;
    }

    function checkWinCondition() {
      if (!isGameWon && targets.length === 0 && enemyDefeats >= MAX_ENEMY_DEFEATS && enemyHp <= 0) {
        isGameWon = true;
        winMessageEl.classList.add("show");
      }
    }

    function animate() {
      const delta = clock.getDelta();

      fireCooldown -= delta;

      updateShip(delta);
      updateEnemy(delta);
      updateBullets(delta, playerBullets);
      updateBullets(delta, enemyBullets);
      updateTargets(delta);
      updateDamage();
      updateCamera();
      updateHud();
      checkWinCondition();

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
