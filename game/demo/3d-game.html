<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Open Space Fly Simulator</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #01020a;
      color: #f1f1f1;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.4;
      z-index: 2;
      max-width: 320px;
    }

    #hud kbd {
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-bottom-width: 2px;
      border-radius: 3px;
      display: inline-block;
      min-width: 18px;
      padding: 0 4px;
      text-align: center;
      font-size: 12px;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      pointer-events: none;
      z-index: 2;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.75);
    }

    #crosshair::before {
      left: 8px;
      top: 0;
      width: 2px;
      height: 18px;
    }

    #crosshair::after {
      left: 0;
      top: 8px;
      width: 18px;
      height: 2px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>3D Fly Simulator</strong></div>
    <div><kbd>Q</kbd> raise altitude • <kbd>E</kbd> lose altitude</div>
    <div><kbd>A</kbd> steer left • <kbd>D</kbd> steer right</div>
    <div><kbd>W</kbd> forward • <kbd>S</kbd> decelerate to stop</div>
    <div><kbd>Space</kbd> fire bullets</div>
    <div id="stats">Speed: 0 | Altitude: 0 | Player HP: 100 | Enemy HP: 3</div>
  </div>
  <div id="crosshair"></div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

    const ARENA = {
      width: 6000,
      length: 6000,
      height: 500,
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x01020a);
    scene.fog = new THREE.Fog(0x01020a, 1500, 7000);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 12000);

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);

    const directional = new THREE.DirectionalLight(0xbfd8ff, 0.85);
    directional.position.set(500, 600, -250);
    scene.add(directional);

    function makeStars(count = 2200) {
      const geometry = new THREE.BufferGeometry();
      const points = new Float32Array(count * 3);

      for (let i = 0; i < count; i += 1) {
        points[i * 3] = THREE.MathUtils.randFloatSpread(12000);
        points[i * 3 + 1] = THREE.MathUtils.randFloatSpread(4000);
        points[i * 3 + 2] = THREE.MathUtils.randFloatSpread(12000);
      }

      geometry.setAttribute("position", new THREE.BufferAttribute(points, 3));
      const material = new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: true });
      const stars = new THREE.Points(geometry, material);
      scene.add(stars);
    }

    makeStars();

    const arenaBox = new THREE.Box3(
      new THREE.Vector3(-ARENA.width / 2, 0, -ARENA.length / 2),
      new THREE.Vector3(ARENA.width / 2, ARENA.height, ARENA.length / 2)
    );

    const boundary = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(ARENA.width, ARENA.height, ARENA.length)),
      new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.35 })
    );
    boundary.position.set(0, ARENA.height / 2, 0);
    scene.add(boundary);

    const ship = new THREE.Group();

    const shipGeom = new THREE.ConeGeometry(20, 60, 3);
    shipGeom.rotateX(Math.PI / 2);
    const shipMat = new THREE.MeshStandardMaterial({ color: 0x67b7ff, flatShading: true, metalness: 0.2, roughness: 0.45 });
    const shipMesh = new THREE.Mesh(shipGeom, shipMat);
    ship.add(shipMesh);

    const wingGeom = new THREE.BoxGeometry(55, 4, 14);
    const wingMat = new THREE.MeshStandardMaterial({ color: 0x2e6ea8 });
    const wing = new THREE.Mesh(wingGeom, wingMat);
    wing.position.set(0, -8, -4);
    ship.add(wing);

    ship.position.set(0, 120, 0);
    scene.add(ship);

    const bulletGeometry = new THREE.SphereGeometry(5, 10, 10);
    const playerBulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const enemyBulletMaterial = new THREE.MeshBasicMaterial({ color: 0xff4444 });
    const bullets = [];
    const enemyBullets = [];

    const enemy = new THREE.Group();
    const enemyBody = new THREE.Mesh(
      new THREE.ConeGeometry(20, 60, 3).rotateX(Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0xff3d3d, flatShading: true, metalness: 0.2, roughness: 0.5 })
    );
    const enemyWing = new THREE.Mesh(
      new THREE.BoxGeometry(55, 4, 14),
      new THREE.MeshStandardMaterial({ color: 0xa81d1d })
    );
    enemyWing.position.set(0, -8, -4);
    enemy.add(enemyBody, enemyWing);
    enemy.position.set(320, 140, -420);
    scene.add(enemy);

    const keys = {
      q: false,
      e: false,
      a: false,
      d: false,
      w: false,
      s: false,
    };

    let speed = 0;
    const maxSpeed = 700;
    const acceleration = 360;
    const deceleration = 430;
    const yawSpeed = 1.55;
    const climbSpeed = 220;

    let fireCooldown = 0;
    const fireInterval = 0.12;
    const collisionRadius = 20;
    let playerHp = 100;
    let enemyHp = 3;
    let enemyFireCooldown = 0;
    let enemyFireInterval = 0.8;
    const enemyTurnSpeed = 0.7;
    let enemyForwardSpeed = 100;
    let enemyAltitudeSpeed = 1;
    const maxEnemyShotsPerSecond = 10;
    const minEnemyFireInterval = 1 / maxEnemyShotsPerSecond;

    const statsEl = document.getElementById("stats");

    function getRandomEnemyPosition() {
      return new THREE.Vector3(
        THREE.MathUtils.randFloat(arenaBox.min.x, arenaBox.max.x),
        THREE.MathUtils.randFloat(arenaBox.min.y + 10, arenaBox.max.y),
        THREE.MathUtils.randFloat(arenaBox.min.z, arenaBox.max.z)
      );
    }

    function respawnEnemy() {
      enemyHp = 3;
      enemy.position.copy(getRandomEnemyPosition());
      enemyForwardSpeed += 1;
      enemyAltitudeSpeed += 1;
      enemyFireInterval = Math.max(minEnemyFireInterval, enemyFireInterval * 0.9);
      enemyFireCooldown = enemyFireInterval;
      enemy.visible = true;
    }

    function clampShipToArena() {
      ship.position.x = THREE.MathUtils.clamp(ship.position.x, arenaBox.min.x, arenaBox.max.x);
      ship.position.y = THREE.MathUtils.clamp(ship.position.y, arenaBox.min.y + 10, arenaBox.max.y);
      ship.position.z = THREE.MathUtils.clamp(ship.position.z, arenaBox.min.z, arenaBox.max.z);
    }

    function fireBullet() {
      const bullet = new THREE.Mesh(bulletGeometry, playerBulletMaterial);
      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(ship.quaternion).normalize();
      const start = ship.position.clone().add(direction.clone().multiplyScalar(40));

      bullet.position.copy(start);
      bullet.userData.velocity = direction.multiplyScalar(1700);
      bullet.userData.life = 2.7;
      scene.add(bullet);
      bullets.push(bullet);
    }

    function fireEnemyBullet() {
      if (enemyHp <= 0) {
        return;
      }

      const bullet = new THREE.Mesh(bulletGeometry, enemyBulletMaterial);
      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(enemy.quaternion).normalize();
      const start = enemy.position.clone().add(direction.clone().multiplyScalar(40));

      bullet.position.copy(start);
      bullet.userData.velocity = direction.multiplyScalar(700);
      bullet.userData.life = 4;
      scene.add(bullet);
      enemyBullets.push(bullet);
    }

    function setKeyState(event, state) {
      const key = event.key.toLowerCase();
      if (key in keys) {
        keys[key] = state;
      }

      if (key === " " && state) {
        event.preventDefault();
      }
    }

    window.addEventListener("keydown", (event) => {
      setKeyState(event, true);
      if (event.key === " ") {
        if (fireCooldown <= 0) {
          fireBullet();
          fireCooldown = fireInterval;
        }
      }
    });

    window.addEventListener("keyup", (event) => setKeyState(event, false));

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function updateShip(delta) {
      if (keys.a) {
        ship.rotation.y += yawSpeed * delta;
      }
      if (keys.d) {
        ship.rotation.y -= yawSpeed * delta;
      }
      if (keys.q) {
        ship.position.y += climbSpeed * delta;
      }
      if (keys.e) {
        ship.position.y -= climbSpeed * delta;
      }

      if (keys.w) {
        speed = Math.min(maxSpeed, speed + acceleration * delta);
      }
      if (keys.s) {
        speed = Math.max(0, speed - deceleration * delta);
      }

      const forward = new THREE.Vector3(0, 0, -1).applyEuler(ship.rotation).normalize();
      ship.position.addScaledVector(forward, speed * delta);

      clampShipToArena();
    }

    function updateCamera() {
      const chaseOffset = new THREE.Vector3(0, 80, 210).applyQuaternion(ship.quaternion);
      const desiredPos = ship.position.clone().add(chaseOffset);
      camera.position.lerp(desiredPos, 0.1);
      camera.lookAt(ship.position.clone().add(new THREE.Vector3(0, 18, 0)));
    }

    function updateBullets(delta) {
      for (let i = bullets.length - 1; i >= 0; i -= 1) {
        const bullet = bullets[i];
        bullet.position.addScaledVector(bullet.userData.velocity, delta);
        bullet.userData.life -= delta;

        const outOfBounds = !arenaBox.containsPoint(bullet.position);
        if (bullet.userData.life <= 0 || outOfBounds) {
          scene.remove(bullet);
          bullets.splice(i, 1);
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i -= 1) {
        const bullet = enemyBullets[i];
        bullet.position.addScaledVector(bullet.userData.velocity, delta);
        bullet.userData.life -= delta;

        const outOfBounds = !arenaBox.containsPoint(bullet.position);
        if (bullet.userData.life <= 0 || outOfBounds) {
          scene.remove(bullet);
          enemyBullets.splice(i, 1);
        }
      }
    }

    function updateEnemy(delta) {
      if (enemyHp <= 0) {
        enemy.visible = false;
        return;
      }

      const toShip = ship.position.clone().sub(enemy.position);
      const flatDirection = new THREE.Vector3(toShip.x, 0, toShip.z);
      if (flatDirection.lengthSq() > 0.0001) {
        const desiredYaw = Math.atan2(flatDirection.x, flatDirection.z) + Math.PI;
        const yawDiff = THREE.MathUtils.euclideanModulo(desiredYaw - enemy.rotation.y + Math.PI, Math.PI * 2) - Math.PI;
        enemy.rotation.y += THREE.MathUtils.clamp(yawDiff, -enemyTurnSpeed * delta, enemyTurnSpeed * delta);
      }

      const forward = new THREE.Vector3(0, 0, -1).applyEuler(enemy.rotation).normalize();
      enemy.position.addScaledVector(forward, enemyForwardSpeed * delta);

      const altitudeDiff = ship.position.y - enemy.position.y;
      enemy.position.y += THREE.MathUtils.clamp(altitudeDiff, -enemyAltitudeSpeed * delta, enemyAltitudeSpeed * delta);
      enemy.position.x = THREE.MathUtils.clamp(enemy.position.x, arenaBox.min.x, arenaBox.max.x);
      enemy.position.y = THREE.MathUtils.clamp(enemy.position.y, arenaBox.min.y + 10, arenaBox.max.y);
      enemy.position.z = THREE.MathUtils.clamp(enemy.position.z, arenaBox.min.z, arenaBox.max.z);

      enemyFireCooldown -= delta;
      if (enemyFireCooldown <= 0) {
        fireEnemyBullet();
        enemyFireCooldown = enemyFireInterval;
      }
    }

    function updateCombat() {
      if (enemyHp > 0) {
        for (let b = bullets.length - 1; b >= 0; b -= 1) {
          const bullet = bullets[b];
          if (bullet.position.distanceTo(enemy.position) <= collisionRadius) {
            scene.remove(bullet);
            bullets.splice(b, 1);
            enemyHp = Math.max(0, enemyHp - 1);
            if (enemyHp <= 0) {
              respawnEnemy();
              break;
            }
          }
        }
      }

      for (let b = enemyBullets.length - 1; b >= 0; b -= 1) {
        const bullet = enemyBullets[b];
        if (bullet.position.distanceTo(ship.position) <= collisionRadius) {
          scene.remove(bullet);
          enemyBullets.splice(b, 1);
          playerHp = Math.max(0, playerHp - 1);
        }
      }

      if (enemyHp > 0 && ship.position.distanceTo(enemy.position) <= collisionRadius * 2) {
        playerHp = Math.max(0, playerHp - 1);
        enemyHp = Math.max(0, enemyHp - 1);
        if (enemyHp <= 0) {
          respawnEnemy();
        }
      }
    }

    function updateHud() {
      statsEl.textContent = `Speed: ${speed.toFixed(0)} | Altitude: ${ship.position.y.toFixed(0)} | Player HP: ${playerHp} | Enemy HP: ${enemyHp}`;
    }

    function animate() {
      const delta = clock.getDelta();

      fireCooldown -= delta;

      updateShip(delta);
      updateEnemy(delta);
      updateBullets(delta);
      updateCombat();
      updateCamera();
      updateHud();

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
