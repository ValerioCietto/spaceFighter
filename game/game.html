<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>SpaceFighter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="station.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <div class="hud" id="hud">
      <div class="hud-row">
        <span class="label">Solar System:</span>
        <span class="value" id="solar-system-value"></span>
      </div>
      <div class="hud-row">
        <span class="label">Pos:</span>
        <span class="value" id="pos-value">0, 0</span>
      </div>
      <div class="hud-row">
        <span class="label">Money:</span>
        <span class="value money-value" id="money-value">0§</span>
      </div>
      <div class="hud-row">
        <span class="label">Velocità:</span>
        <span class="value" id="speed-value">0.0</span>
        <span class="label">px/s</span>
      </div>
      <div class="hud-row">
        <span class="label">Shield:</span>
        <span class="value shield-value" id="shield-value">0</span>
      </div>
      <div class="hud-row">
        <span class="label">Hull:</span>
        <span class="value hull-value" id="hull-value">0</span>
      </div>
      <div class="hud-row">
        <span class="label">Energy:</span>
        <span class="value energy-value" id="energy-value">0</span>
      </div>
    </div>

    <div id="minimap">
      <canvas id="minimap-canvas"></canvas>
    </div>
    <button id="inventory-btn" class="inventory-btn" type="button">
      Inventory
    </button>
    <button id="galaxy-map-btn" class="galaxy-map-btn" type="button">
      Galaxy Map
    </button>
    <button id="station-overlay-btn" class="station-overlay-btn" type="button">
      Station
    </button>
    <button id="hyperspace-btn" class="hyperspace-btn" type="button">
      Hyperspace!
    </button>

    <!-- Station dialog overlay -->
    <div class="station-overlay" id="station-overlay" aria-hidden="true">
      <div class="station-dialog" role="dialog" aria-modal="true">
        <div class="station-dialog-header">
          <h2 class="station-title" id="station-title">Station</h2>
          <button class="station-exit-btn" id="station-exit-btn" type="button">Exit Station</button>
        </div>
        <h3 id="station-section-title">Shipyard · New ships</h3>
        <div class="tab-menu-container" id="station-tabs">
          <button class="tab-btn is-active" data-tab="Shipyard" type="button">Shipyard</button>
          <button class="tab-btn" data-tab="Outfits" type="button">Outfits</button>
          <button class="tab-btn" data-tab="Weapons" type="button">Weapons</button>
          <button class="tab-btn" data-tab="Market" type="button">Market</button>
          <button class="tab-btn" data-tab="Bank" type="button">Bank</button>
          <button class="tab-btn" data-tab="Plaza" type="button">Plaza</button>
        </div>
        <div style="height: 5px;"></div>
        <div class="subtab-menu-container" id="station-subtabs"></div>
        
        <div class="station-dialog-body">
          <div style="height: 5px;"></div>
          <div id="station-content" style="width:-webkit-fill-available; overflow-y: scroll;"></div>
        </div>
      </div>
    </div>

    <!-- Inventory overlay -->
    <div class="inventory-overlay" id="inventory-overlay" aria-hidden="true">
      <div class="inventory-dialog" role="dialog" aria-modal="true">
        <div class="inventory-header">
          <h2>Inventory <span id="stat-credits">0</span>§</h2>
          <div class="inventory-header-actions">
            <button id="inventory-tutorial-btn" type="button">Tutorial</button>
            <button id="inventory-close-btn" type="button">Close</button>
          </div>
        </div>

        <div class="inventory-body">
          <div class="inv-tabs" role="tablist" aria-label="Inventory Tabs">
            <button class="inv-tab is-active" type="button" role="tab" aria-selected="true" data-tab="current">
              Current ship
            </button>
            <button class="inv-tab" type="button" role="tab" aria-selected="false" data-tab="owned">
              Owned ships
            </button>
          </div>

          <div class="inv-panels">
            <section class="inv-panel is-active" role="tabpanel" data-panel="current"></section>
            <section class="inv-panel" role="tabpanel" data-panel="owned"></section>
          </div>
        </div>
      </div>
    </div>

    <!-- Death screen overlay -->
    <div class="tutorial-overlay" id="tutorial-overlay" aria-hidden="true">
      <div id="tutorial-annotations"></div>
      <div class="tutorial-dialog tutorial-center-dialog" role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
        <h2 id="tutorial-title">Tutorial</h2>
        <div class="tutorial-actions">
          <button id="tutorial-close-btn" type="button">Exit tutorial</button>
        </div>
      </div>
    </div>

    <!-- Death screen overlay -->
    <div class="death-overlay" id="death-overlay" aria-hidden="true">
      <div class="death-dialog" role="dialog" aria-modal="true">
        <h2>Ship Destroyed</h2>
        <p>Your hull integrity reached zero.</p>

        <div class="death-actions">
          <button id="death-reload-btn" type="button">
            Reload from last system
          </button>
          <button id="death-restart-btn" type="button">
            Return to start menu
          </button>
        </div>
      </div>
    </div>

    <!-- Galaxy map overlay -->
    <div class="galaxy-overlay" id="galaxy-overlay" aria-hidden="true">
      <div class="galaxy-dialog" role="dialog" aria-modal="true">
        <div class="galaxy-header">
          <h2>Galaxy Map</h2>
          <button id="galaxy-close-btn" type="button">Close</button>
        </div>

        <div class="galaxy-body">
          <iframe
            id="galaxy-iframe"
            class="galaxy-iframe"
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </div>
    <script src="../baseUrl.js"></script>
    <script>
    (function () {
      const iframe = document.getElementById("galaxy-iframe");
      const baseUrl = window.BASE_URL || "/";
      console.log("[Game] Base URL for galaxy map iframe:", baseUrl);
      const galaxyMapUrl = new URL("game/galaxy-map-viewer.html", baseUrl).toString();
      console.log("[Game] Setting galaxy map iframe src to:", galaxyMapUrl);
      iframe.src = new URL("game/galaxy-map-viewer.html", baseUrl).toString();

      const toAbsolute = (uri) => {
        if (!uri || /^(?:[a-z]+:|\/\/|#|data:|mailto:|tel:)/i.test(uri)) return uri;
        return new URL(uri, baseUrl).toString();
      };

      document.querySelectorAll("a[href], img[src]").forEach((el) => {
        if (el.tagName === "A") {
          el.href = toAbsolute(el.getAttribute("href"));
        } else if (el.tagName === "IMG") {
          el.src = toAbsolute(el.getAttribute("src"));
        }
      });
    })();
    </script>

    <div id="touch-controls">
      <div class="touch-group">
        <div class="touch-btn" data-action="left">←</div>
        <div class="touch-btn" data-action="right">→</div>
      </div>
      <div class="touch-group">
        <div class="touch-btn primary" data-action="fire">●</div>
        <div class="touch-btn" data-action="lock">◎</div>
        <div class="touch-btn" data-action="weapon-cycle">↺</div>
      </div>
      <div class="touch-group touch-column">
        <div class="touch-btn primary" data-action="thrust">▲</div>
        <div class="touch-btn" data-action="brake">▼</div>
      </div>
    </div>

  </div>
  <script src="const.js"></script>
  <script src="station-manager.js"></script>
  <script src="input.js"></script>
  <script src="outfitManager.js"></script>
  <script src="shipStatProvider.js"></script>
  <script src="stationShipShop.js"></script>
  <script src="stationOutfitShop.js"></script>
  <script src="inventoryDialog.js"></script>
  <script src="weapon_system.js"></script>
  <script src="starDrawer.js"></script>
  <script src="systemInfo.js"></script>
  <script src="hyperSpaceManager.js"></script>
  <script src="game.js"></script>

</body>
</html>
