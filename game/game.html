<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>SpaceFighter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="station.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <div class="hud" id="hud">
      <div class="hud-row">
        <span class="label">Solar System:</span>
        <span class="value" id="solar-system-value"></span>
      </div>
      <div class="hud-row">
        <span class="label">Pos:</span>
        <span class="value" id="pos-value">0, 0</span>
      </div>
      <div class="hud-row">
        <span class="label">Money:</span>
        <span class="value money-value" id="money-value">0§</span>
      </div>
      <div class="hud-row">
        <span class="label">Velocità:</span>
        <span class="value" id="speed-value">0.0</span>
        <span class="label">px/s</span>
      </div>
      <div class="hud-row">
        <span class="label">Shield:</span>
        <span class="value shield-value" id="shield-value">0</span>
      </div>
      <div class="hud-row">
        <span class="label">Hull:</span>
        <span class="value hull-value" id="hull-value">0</span>
      </div>
      <div class="hud-row">
        <span class="label">Energy:</span>
        <span class="value energy-value" id="energy-value">0</span>
      </div>
    </div>

    <div id="minimap">
      <canvas id="minimap-canvas"></canvas>
    </div>
    <button id="dock-button" type="button">Dock</button>
    <button id="inventory-btn" class="inventory-btn" type="button">
      Inventory
    </button>
    <button id="galaxy-map-btn" class="galaxy-map-btn" type="button">
      Galaxy Map
    </button>
    <button id="station-overlay-btn" class="station-overlay-btn" type="button">
      Station
    </button>
    <!-- Docking message -->
    <div id="docking-message" class="docking-message">
      docking with station...
    </div>

    <!-- Station dialog overlay -->
    <div class="station-overlay" id="station-overlay" aria-hidden="true">
      <div class="station-dialog" role="dialog" aria-modal="true">
        <div class="station-dialog-header">
          <h2 class="station-title" id="station-title">Station</h2>
          <button class="station-exit-btn" id="station-exit-btn" type="button">Exit Station</button>
        </div>
        <h3>Spaceship shop</h3>
        <div class="station-dialog-body">
          

          <!-- where cards will be injected -->
          <div id="ship-shop-list"></div>
          <!--<iframe
            src="/game/outfits-shop.html"
            class="outfits-shop-iframe"
            loading="lazy"
          ></iframe>-->
        </div>
      </div>
    </div>

    <!-- Inventory overlay -->
    <div class="inventory-overlay" id="inventory-overlay" aria-hidden="true">
      <div class="inventory-dialog" role="dialog" aria-modal="true">
        <div class="inventory-header">
          <h2>Inventory</h2>
          <button id="inventory-close-btn" type="button">Close</button>
        </div>

        <div class="inventory-body">
          <ul class="inventory-stats">
            <li><strong>Credits:</strong> <span id="stat-credits">12000</span></li>
            <li><strong>Hull:</strong> <span id="stat-hull">85%</span></li>
            <li><strong>Shield:</strong> <span id="stat-shield">60%</span></li>
            <li><strong>Cargo:</strong> <span id="stat-cargo">12 / 30</span></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Death screen overlay -->
    <div class="death-overlay" id="death-overlay" aria-hidden="true">
      <div class="death-dialog" role="dialog" aria-modal="true">
        <h2>Ship Destroyed</h2>
        <p>Your hull integrity reached zero.</p>

        <div class="death-actions">
          <button id="death-reload-btn" type="button">
            Reload from last system
          </button>
          <button id="death-restart-btn" type="button">
            Restart from save file
          </button>
        </div>
      </div>
    </div>

    <!-- Galaxy map overlay -->
    <div class="galaxy-overlay" id="galaxy-overlay" aria-hidden="true">
      <div class="galaxy-dialog" role="dialog" aria-modal="true">
        <div class="galaxy-header">
          <h2>Galaxy Map</h2>
          <button id="galaxy-close-btn" type="button">Close</button>
        </div>

        <div class="galaxy-body">
          <iframe
            id="galaxy-iframe"
            class="galaxy-iframe"
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </div>
    <script>
    (function () {
      const iframe = document.getElementById("galaxy-iframe");
      const isGithub = location.hostname.endsWith("github.io");
      iframe.src = isGithub
        ? "https://valeriocietto.github.io/game/galaxy-map-viewer.html"
        : "/game/galaxy-map-viewer.html";
    })();
    </script>

    <div id="touch-controls">
      <div class="touch-group">
        <div class="touch-btn" data-action="left">←</div>
        <div class="touch-btn" data-action="right">→</div>
      </div>
      <div class="touch-group">
        <div class="touch-btn primary" data-action="fire">●</div>
        <div class="touch-btn" data-action="lock">◎</div>
        <div class="touch-btn" data-action="weapon-cycle">↺</div>
      </div>
      <div class="touch-group touch-column">
        <div class="touch-btn primary" data-action="thrust">▲</div>
        <div class="touch-btn" data-action="brake">▼</div>
      </div>
    </div>

  </div>
  <script src="const.js"></script>
  <script src="station-manager.js"></script>
  <script src="input.js"></script>
  <script src="shipStatProvider.js"></script>
  <script src="stationShipShop.js"></script>
  <script src="inventoryDialog.js"></script>
  <script src="weapon_system.js"></script>
  <script src="starDrawer.js"></script>
  <script src="systemInfo.js"></script>
  <script src="game.js"></script>

</body>
</html>
