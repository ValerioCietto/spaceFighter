<!-- Command to launch: npx serve .  then open http://localhost:3000/gate-simple.html -->
<!doctype html>
<html>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize() {
  c.width = innerWidth;
  c.height = innerHeight;
}
addEventListener("resize", resize);
resize();

let t = 0;

function draw() {
  t += 0.02;
  ctx.clearRect(0, 0, c.width, c.height);

  const cx = c.width / 2;
  const cy = c.height / 2;
  const r = Math.min(c.width, c.height) * 0.25;

  // Wormhole swirl
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  for (let i = 0; i < 120; i++) {
    const a = i * 0.25 + t;
    const rr = r * (1 - i / 120);
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.strokeStyle = "rgba(120,180,255,0.6)";
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();

  // Metal frame
  ctx.beginPath();
  ctx.arc(cx, cy, r + 10, 0, Math.PI * 2);
  ctx.strokeStyle = "#888";
  ctx.lineWidth = 14;
  ctx.stroke();

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
