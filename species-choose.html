<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Starfighter — Choose Species</title>
  <link rel="stylesheet" href="css/species.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="back" aria-label="Back to Start">←</a>
    <h1>Choose Your Species</h1>
    <div class="spacer"></div>
  </header>

  <main class="grid">
    <!-- Cards generated by JS -->
  </main>

  <footer class="foot">
    <button id="btnSkip" class="btn ghost">Skip (Random)</button>
  </footer>

  <script src="baseUrl.js"></script>
  <script src="js/config.js"></script>
  <script src="js/save.js"></script>
  <script src="js/species.js"></script>
  <script>
    (function () {
      const baseUrl = window.BASE_URL || '/';
      const toAbsolute = (uri) => {
        if (!uri || /^(?:[a-z]+:|\/\/|#|data:|mailto:|tel:)/i.test(uri)) return uri;
        return new URL(uri, baseUrl).toString();
      };

      document.querySelectorAll('a[href], img[src]').forEach((el) => {
        if (el.tagName === 'A') {
          el.href = toAbsolute(el.getAttribute('href'));
        } else if (el.tagName === 'IMG') {
          el.src = toAbsolute(el.getAttribute('src'));
        }
      });
    })();
  </script>
</body>
</html>
