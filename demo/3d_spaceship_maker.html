<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Spaceship Maker</title>
  <style>
    :root {
      --bg: #0a1020;
      --panel: #111a31;
      --line: #2f3f6a;
      --text: #e7efff;
      --muted: #9fb3db;
      --accent: #6eb9ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #1a2d55, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 14px;
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr 1fr;
      gap: 12px;
      height: calc(100vh - 70px);
      min-height: 560px;
    }
    .panel {
      background: color-mix(in srgb, var(--panel), black 15%);
      border: 1px solid #2e406f;
      border-radius: 10px;
      padding: 12px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel h2 { font-size: 15px; margin: 0; color: var(--muted); letter-spacing: .03em; }
    .module-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      border: 1px solid #3a5088;
      background: #1a2a4e;
      color: var(--text);
      border-radius: 7px;
      padding: 8px 9px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { border-color: var(--accent); }
    .views { display: flex; gap: 8px; }
    .views button.active { background: #25427d; border-color: #89ccff; }

    .build-shell {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      background: #0c1326;
      min-height: 320px;
    }
    .build-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(173, 204, 255, .1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(173, 204, 255, .1) 1px, transparent 1px),
        linear-gradient(to right, rgba(173, 204, 255, .22) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(173, 204, 255, .22) 1px, transparent 1px);
      background-size: 5px 5px, 5px 5px, 25px 25px, 25px 25px;
      background-position: center center;
    }
    .build-item {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 1px dashed rgba(255,255,255,.25);
      background: rgba(255,255,255,0.04);
      cursor: grab;
      user-select: none;
      display: grid;
      place-items: center;
    }
    .build-item .glyph {
      width: 24px;
      height: 24px;
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
      background: currentColor;
    }
    .build-item .glyph-cube { border-radius: 5px; }
    .build-item .glyph-smallCube {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    .build-item .glyph-sphere { border-radius: 50%; }
    .build-item .glyph-cone3 {
      clip-path: polygon(50% 4%, 94% 92%, 6% 92%);
      border: 0;
    }
    .build-item .glyph-cone4 {
      clip-path: polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%);
      border: 0;
    }
    .build-item .glyph-parallelepipede {
      width: 28px;
      height: 18px;
      border-radius: 4px;
    }
    .build-item .glyph-truncatedCone {
      clip-path: polygon(20% 8%, 80% 8%, 98% 92%, 2% 92%);
      border: 0;
    }
    .build-item .glyph-cannon {
      width: 26px;
      height: 10px;
      border-radius: 8px;
    }
    .build-item .glyph-thruster {
      width: 26px;
      height: 14px;
      clip-path: polygon(8% 22%, 8% 78%, 92% 94%, 92% 6%);
      border: 0;
    }
    .build-item .glyph-leftWing,
    .build-item .glyph-rightWing {
      width: 26px;
      height: 20px;
      clip-path: polygon(8% 100%, 92% 50%, 8% 0%);
      border: 0;
    }
    .build-item .glyph-rightWing { transform: scaleX(-1); }
    .build-item.selected { outline: 2px solid #aaddff; }
    .legend { font-size: 12px; color: var(--muted); }
    .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .actions button[hidden] { display: none; }
    .axis { font-size: 12px; color: #cde2ff; }
    #previewCanvas { flex: 1; min-height: 320px; border: 1px solid var(--line); border-radius: 8px; display:block; width:100%; }
    .export-actions { display:flex; gap:8px; flex-wrap: wrap; }
    #exportCode {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0b1328;
      color: #d9e7ff;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h1>3D Spaceship Maker</h1>
  <div class="layout">
    <section class="panel">
      <h2>Modules</h2>
      <div class="module-grid" id="moduleGrid"></div>
      <label class="check-row"><input type="checkbox" id="mirroredMode"> Mirrored mode</label>
      <p class="legend">Click a module to add it to BuildArea.</p>
    </section>

    <section class="panel">
      <h2>BuildArea</h2>
      <div class="views" id="viewButtons">
        <button data-view="top">Top (X/Y)</button>
        <button data-view="side">Side (Y/Z)</button>
        <button data-view="front" class="active">Front (X/Z)</button>
      </div>
      <div class="axis" id="axisLabel">Editing axes: X / Z</div>
      <div class="build-shell" id="buildShell">
        <div class="build-grid" id="buildGrid"></div>
      </div>
      <div class="actions">
        <button id="deleteButton">Delete selected</button>
        <button id="mergeButton" hidden>Merge</button>
      </div>
      <p class="legend">Drag modules on grid. Snap: 5px.</p>
    </section>

    <section class="panel">
      <h2>Preview</h2>
      <canvas id="previewCanvas"></canvas>
      <p class="legend">Click + drag to rotate preview.</p>
      <div class="export-actions">
        <button id="exportModelBtn">Export model code (Three.js)</button>
        <button id="copyExportBtn">Copy code</button>
      </div>
      <textarea id="exportCode" readonly placeholder="Click \"Export model code\" to generate JavaScript code"></textarea>
    </section>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

    const rotateZGeometry = (geometry) => {
      geometry.rotateZ(Math.PI / 2);
      return geometry;
    };

    const createWingGeometry = (mirror = false) => {
      const shape = new THREE.Shape();
      shape.moveTo(-8, -10);
      shape.lineTo(12, 0);
      shape.lineTo(-8, 10);
      shape.closePath();
      const geometry = new THREE.ExtrudeGeometry(shape, { depth: 2, bevelEnabled: false });
      geometry.center();
      if (mirror) geometry.scale(-1, 1, 1);
      geometry.rotateY(-Math.PI / 2);
      return geometry;
    };

    const modules = [
      { key: 'cone3', name: '3 faces cone', short: 'C3', color: '#ffb970', geo: () => new THREE.ConeGeometry(6, 16, 3) },
      { key: 'cone4', name: '4 faces cone', short: 'C4', color: '#ffd86d', geo: () => new THREE.ConeGeometry(6, 16, 4) },
      { key: 'cube', name: 'cube', short: 'CB', color: '#8ee2ff', geo: () => new THREE.BoxGeometry(12, 12, 12) },
      { key: 'smallCube', name: 'small cube solid', short: 'SC', color: '#5fd0ff', geo: () => new THREE.BoxGeometry(6, 6, 6) },
      { key: 'sphere', name: 'sphere', short: 'SP', color: '#9fffc4', geo: () => new THREE.SphereGeometry(7, 16, 12) },
      { key: 'parallelepipede', name: 'parallelepipede', short: 'PP', color: '#d6adff', geo: () => new THREE.BoxGeometry(18, 10, 8) },
      { key: 'truncatedCone', name: 'truncated cone', short: 'TC', color: '#ff9cac', geo: () => new THREE.CylinderGeometry(4, 7, 14, 18) },
      { key: 'cannon', name: 'cannon', short: 'CN', color: '#ff9f8f', geo: () => rotateZGeometry(new THREE.CylinderGeometry(3, 3, 16, 18)) },
      { key: 'thruster', name: 'thuster', short: 'TH', color: '#ffcb88', geo: () => (new THREE.CylinderGeometry(2, 5, 14, 18)).rotateZ(-Math.PI / 2) },
      { key: 'leftWing', name: 'left wing', short: 'LW', color: '#91b6ff', geo: () => createWingGeometry(false) },
      { key: 'rightWing', name: 'right wing', short: 'RW', color: '#b8ccff', geo: () => createWingGeometry(true) }
    ];

    const state = {
      view: 'front',
      selectedIds: new Set(),
      nextId: 1,
      nextMergedId: 1,
      parts: []
    };

    const moduleGrid = document.getElementById('moduleGrid');
    const buildShell = document.getElementById('buildShell');
    const buildGrid = document.getElementById('buildGrid');
    const axisLabel = document.getElementById('axisLabel');
    const mergeButton = document.getElementById('mergeButton');
    const deleteButton = document.getElementById('deleteButton');
    const exportModelBtn = document.getElementById('exportModelBtn');
    const copyExportBtn = document.getElementById('copyExportBtn');
    const exportCode = document.getElementById('exportCode');
    const mirroredMode = document.getElementById('mirroredMode');

    modules.forEach((mod) => {
      const b = document.createElement('button');
      b.textContent = mod.name;
      b.addEventListener('click', () => addPart(mod));
      moduleGrid.appendChild(b);
    });

    function addPart(module) {
      const p = { id: state.nextId++, module: module.key, x: 0, y: 0, z: 0, twinId: null };
      state.parts.push(p);

      if (mirroredMode.checked) {
        const twin = { id: state.nextId++, module: module.key, x: 0, y: 0, z: 0, twinId: p.id };
        p.twinId = twin.id;
        state.parts.push(twin);
        state.selectedIds = new Set([p.id, twin.id]);
      } else {
        state.selectedIds = new Set([p.id]);
      }

      renderBuildArea();
      syncPreview();
    }

    function applyMirrorInCurrentView(part, twinPart) {
      const { sx, sy } = viewToScreen(part);
      applyScreenToPart(twinPart, -sx, sy);
    }

    function updateMergeButton() {
      const selectedParts = state.parts.filter((p) => state.selectedIds.has(p.id));
      const canMerge = selectedParts.length > 1 && selectedParts.every((p) => p.module === 'cube');
      mergeButton.hidden = !canMerge;
      mergeButton.disabled = !canMerge;
    }

    function buildMergedHullGeometry(parts, origin) {
      const cubeSize = 12;
      const half = cubeSize / 2;
      const positions = [];
      const normals = [];
      const indices = [];
      const occupied = new Set(parts.map((p) => `${p.x},${p.y},${p.z}`));
      const dirs = [
        { check: [5, 0, 0], normal: [1, 0, 0], corners: [[half, -half, -half], [half, half, -half], [half, half, half], [half, -half, half]] },
        { check: [-5, 0, 0], normal: [-1, 0, 0], corners: [[-half, -half, half], [-half, half, half], [-half, half, -half], [-half, -half, -half]] },
        { check: [0, 5, 0], normal: [0, 1, 0], corners: [[-half, half, -half], [-half, half, half], [half, half, half], [half, half, -half]] },
        { check: [0, -5, 0], normal: [0, -1, 0], corners: [[-half, -half, half], [-half, -half, -half], [half, -half, -half], [half, -half, half]] },
        { check: [0, 0, 5], normal: [0, 0, 1], corners: [[-half, -half, half], [half, -half, half], [half, half, half], [-half, half, half]] },
        { check: [0, 0, -5], normal: [0, 0, -1], corners: [[half, -half, -half], [-half, -half, -half], [-half, half, -half], [half, half, -half]] }
      ];

      const addFace = (base, dir) => {
        const start = positions.length / 3;
        dir.corners.forEach(([x, y, z]) => {
          positions.push(((base.x - origin.x) * 0.35) + (x * 0.35), ((base.y - origin.y) * 0.35) + (y * 0.35), ((base.z - origin.z) * 0.35) + (z * 0.35));
          normals.push(...dir.normal);
        });
        indices.push(start, start + 1, start + 2, start, start + 2, start + 3);
      };

      parts.forEach((p) => {
        dirs.forEach((dir) => {
          const key = `${p.x + dir.check[0]},${p.y + dir.check[1]},${p.z + dir.check[2]}`;
          if (!occupied.has(key)) addFace(p, dir);
        });
      });

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geometry.setIndex(indices);
      return geometry;
    }

    function mergeSelectedCubes() {
      const selectedParts = state.parts.filter((p) => state.selectedIds.has(p.id));
      if (selectedParts.length < 2 || selectedParts.some((p) => p.module !== 'cube')) return;

      const mergedModuleKey = `mergedHull${state.nextMergedId++}`;
      const center = selectedParts.reduce((acc, p) => {
        acc.x += p.x;
        acc.y += p.y;
        acc.z += p.z;
        return acc;
      }, { x: 0, y: 0, z: 0 });
      center.x = snap(center.x / selectedParts.length);
      center.y = snap(center.y / selectedParts.length);
      center.z = snap(center.z / selectedParts.length);

      modules.push({
        key: mergedModuleKey,
        name: 'merged hull',
        short: 'MH',
        color: '#7fffe0',
        geo: () => buildMergedHullGeometry(selectedParts, center)
      });

      state.parts = state.parts.filter((p) => !state.selectedIds.has(p.id));
      const mergedPart = { id: state.nextId++, module: mergedModuleKey, x: center.x, y: center.y, z: center.z };
      state.parts.push(mergedPart);
      state.selectedIds = new Set([mergedPart.id]);
      renderBuildArea();
      syncPreview();
    }

    mergeButton.addEventListener('click', mergeSelectedCubes);

    function deleteSelectedParts() {
      if (!state.selectedIds.size) return;
      state.parts = state.parts.filter((part) => !state.selectedIds.has(part.id));
      state.parts.forEach((part) => {
        if (part.twinId && !state.parts.some((candidate) => candidate.id === part.twinId)) {
          part.twinId = null;
        }
      });
      state.selectedIds.clear();
      renderBuildArea();
      syncPreview();
    }

    deleteButton.addEventListener('click', deleteSelectedParts);

    function viewToScreen(part) {
      if (state.view === 'top') return { sx: part.x, sy: part.y };
      if (state.view === 'side') return { sx: part.y, sy: part.z };
      return { sx: part.x, sy: part.z };
    }

    function applyScreenToPart(part, sx, sy) {
      if (state.view === 'top') { part.x = sx; part.y = sy; }
      else if (state.view === 'side') { part.y = sx; part.z = sy; }
      else { part.x = sx; part.z = sy; }
    }

    function renderBuildArea() {
      const rect = buildShell.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      buildGrid.innerHTML = '';

      state.parts.forEach((part) => {
        const mod = modules.find((m) => m.key === part.module);
        const { sx, sy } = viewToScreen(part);
        const el = document.createElement('div');
        el.className = 'build-item' + (state.selectedIds.has(part.id) ? ' selected' : '');
        el.style.left = `${cx + sx - 18}px`;
        el.style.top = `${cy - sy - 18}px`;
        el.style.color = mod.color;
        const glyph = document.createElement('div');
        glyph.className = `glyph glyph-${mod.key}`;
        glyph.title = mod.name;
        el.appendChild(glyph);
        el.dataset.id = part.id;
        el.addEventListener('pointerdown', startDrag);
        el.addEventListener('click', (event) => {
          if (event.shiftKey) {
            if (state.selectedIds.has(part.id)) state.selectedIds.delete(part.id);
            else state.selectedIds.add(part.id);
          } else {
            state.selectedIds = new Set([part.id]);
          }
          renderBuildArea();
        });
        buildGrid.appendChild(el);
      });
      updateMergeButton();
    }

    function snap(v) { return Math.round(v / 5) * 5; }

    function startDrag(e) {
      const id = Number(e.currentTarget.dataset.id);
      const part = state.parts.find((p) => p.id === id);
      if (!part) return;
      if (!state.selectedIds.has(id)) state.selectedIds = new Set([id]);
      const selectedParts = state.parts.filter((p) => state.selectedIds.has(p.id));
      const starts = new Map(selectedParts.map((p) => [p.id, viewToScreen(p)]));
      const origin = { x: e.clientX, y: e.clientY };
      e.currentTarget.setPointerCapture(e.pointerId);

      const move = (ev) => {
        const dx = ev.clientX - origin.x;
        const dy = ev.clientY - origin.y;
        selectedParts.forEach((selectedPart) => {
          const start = starts.get(selectedPart.id);
          const nextSX = snap(start.sx + dx);
          const nextSY = snap(start.sy - dy);
          applyScreenToPart(selectedPart, nextSX, nextSY);
        });

        selectedParts.forEach((selectedPart) => {
          if (!selectedPart.twinId) return;
          const twinPart = state.parts.find((p) => p.id === selectedPart.twinId);
          if (!twinPart) return;
          applyMirrorInCurrentView(selectedPart, twinPart);
        });

        renderBuildArea();
        syncPreview();
      };
      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }

    document.getElementById('viewButtons').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-view]');
      if (!btn) return;
      state.view = btn.dataset.view;
      document.querySelectorAll('#viewButtons button').forEach((b) => b.classList.toggle('active', b === btn));
      axisLabel.textContent = state.view === 'top'
        ? 'Editing axes: X / Y'
        : (state.view === 'side' ? 'Editing axes: Y / Z' : 'Editing axes: X / Z');
      buildGrid.style.filter = state.view === 'side' ? 'hue-rotate(70deg)' : (state.view === 'front' ? 'hue-rotate(145deg)' : 'none');
      renderBuildArea();
    });

    let shipGroup = null;

    const canvas = document.getElementById('previewCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1328);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
    camera.position.set(64, 44, 88);

    scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x121733, 1));
    const dir = new THREE.DirectionalLight(0xffffff, 0.85);
    dir.position.set(35, 40, 25);
    scene.add(dir);

    shipGroup = new THREE.Group();
    scene.add(shipGroup);

    const grid = new THREE.GridHelper(180, 36, 0x4466aa, 0x223355);
    grid.position.y = -40;
    scene.add(grid);

    function resizeRenderer() {
      const rect = canvas.getBoundingClientRect();
      renderer.setSize(rect.width, rect.height, false);
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', () => { resizeRenderer(); render(); });

    function clearShipGroup() {
      if (!shipGroup) return;
      while (shipGroup.children.length) {
        const child = shipGroup.children[0];
        shipGroup.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
    }

    function syncPreview() {
      clearShipGroup();
      state.parts.forEach((p) => {
        const mod = modules.find((m) => m.key === p.module);
        const mesh = new THREE.Mesh(
          mod.geo(),
          new THREE.MeshStandardMaterial({ color: mod.color, roughness: 0.45, metalness: 0.2 })
        );
        mesh.position.set(p.x * 0.35, p.y * 0.35, p.z * 0.35);
        shipGroup.add(mesh);
      });
      render();
    }

    function generateExportCode() {
      if (!state.parts.length) {
        return [
          'import * as THREE from "three";',
          '',
          'export function createSpaceshipModel() {',
          '  const shipGroup = new THREE.Group();',
          '  return shipGroup;',
          '}'
        ].join('\n');
      }

      const geometryMap = {
        cone3: 'new THREE.ConeGeometry(6, 16, 3)',
        cone4: 'new THREE.ConeGeometry(6, 16, 4)',
        cube: 'new THREE.BoxGeometry(12, 12, 12)',
        smallCube: 'new THREE.BoxGeometry(6, 6, 6)',
        sphere: 'new THREE.SphereGeometry(7, 16, 12)',
        parallelepipede: 'new THREE.BoxGeometry(18, 10, 8)',
        truncatedCone: 'new THREE.CylinderGeometry(4, 7, 14, 18)',
        cannon: '(() => { const g = new THREE.CylinderGeometry(3, 3, 16, 18); g.rotateZ(Math.PI / 2); return g; })()',
        thruster: '(() => { const g = new THREE.CylinderGeometry(2, 5, 14, 18); g.rotateZ(-Math.PI / 2); return g; })()',
        leftWing: '(() => { const s = new THREE.Shape(); s.moveTo(-8, -10); s.lineTo(12, 0); s.lineTo(-8, 10); s.closePath(); const g = new THREE.ExtrudeGeometry(s, { depth: 2, bevelEnabled: false }); g.center(); g.rotateY(-Math.PI / 2); return g; })()',
        rightWing: '(() => { const s = new THREE.Shape(); s.moveTo(-8, -10); s.lineTo(12, 0); s.lineTo(-8, 10); s.closePath(); const g = new THREE.ExtrudeGeometry(s, { depth: 2, bevelEnabled: false }); g.center(); g.scale(-1, 1, 1); g.rotateY(-Math.PI / 2); return g; })()'
      };

      const lines = [
        'import * as THREE from "three";',
        '',
        '// Auto-generated by 3D Spaceship Maker',
        'export function createSpaceshipModel() {',
        '  const shipGroup = new THREE.Group();',
        ''
      ];

      state.parts.forEach((p, index) => {
        const mod = modules.find((m) => m.key === p.module);
        if (!mod) return;
        lines.push(`  // Part ${index + 1}: ${mod.name}`);
        lines.push(`  const geo${index} = ${geometryMap[mod.key]};`);
        lines.push(`  const mat${index} = new THREE.MeshStandardMaterial({ color: "${mod.color}", roughness: 0.45, metalness: 0.2 });`);
        lines.push(`  const mesh${index} = new THREE.Mesh(geo${index}, mat${index});`);
        lines.push(`  mesh${index}.position.set(${(p.x * 0.35).toFixed(2)}, ${(p.y * 0.35).toFixed(2)}, ${(p.z * 0.35).toFixed(2)});`);
        lines.push(`  shipGroup.add(mesh${index});`);
        lines.push('');
      });

      lines.push('  return shipGroup;');
      lines.push('}');
      return lines.join('\n');
    }

    exportModelBtn.addEventListener('click', () => {
      exportCode.value = generateExportCode();
      exportCode.scrollTop = 0;
    });

    copyExportBtn.addEventListener('click', async () => {
      if (!exportCode.value.trim()) {
        exportCode.value = generateExportCode();
      }

      try {
        await navigator.clipboard.writeText(exportCode.value);
        copyExportBtn.textContent = 'Copied!';
      } catch {
        copyExportBtn.textContent = 'Copy failed';
      }
      setTimeout(() => {
        copyExportBtn.textContent = 'Copy code';
      }, 1400);
    });

    let yaw = 0.85;
    let pitch = 0.35;
    let dist = 130;
    let rotating = false;
    let startDragPos = { x: 0, y: 0 };

    canvas.addEventListener('pointerdown', (e) => {
      rotating = true;
      startDragPos = { x: e.clientX, y: e.clientY };
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!rotating) return;
      const dx = e.clientX - startDragPos.x;
      const dy = e.clientY - startDragPos.y;
      startDragPos = { x: e.clientX, y: e.clientY };
      yaw -= dx * 0.01;
      pitch = Math.max(-1.2, Math.min(1.2, pitch - dy * 0.01));
      render();
    });
    canvas.addEventListener('pointerup', () => { rotating = false; });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      dist = Math.max(50, Math.min(240, dist + e.deltaY * 0.05));
      render();
    }, { passive: false });

    function render() {
      camera.position.set(
        Math.cos(yaw) * Math.cos(pitch) * dist,
        Math.sin(pitch) * dist,
        Math.sin(yaw) * Math.cos(pitch) * dist
      );
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(() => {
      resizeRenderer();
      buildGrid.style.filter = 'hue-rotate(145deg)';
      renderBuildArea();
      syncPreview();
      exportCode.value = generateExportCode();
    });
  </script>
</body>
</html>
